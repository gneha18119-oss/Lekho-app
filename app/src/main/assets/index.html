<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>लेखो ऐप</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  background:#f5f7fb;
  color:#172033
}

body{overflow-x:hidden}

.wrap{
  max-width:720px;
  margin:auto;
  padding:10px 10px 90px
}

.hidden{display:none!important}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:16px;
  margin:10px 0;
  box-shadow:0 8px 24px rgba(15,23,42,.07)
}

h1,h2,h3{margin:0 0 10px}

.muted{
  color:#64748b;
  font-size:13px
}

.msg{
  display:none;
  padding:11px;
  border-radius:12px;
  font-weight:700;
  margin:8px 0
}

.msg.show{display:block}

.ok{
  background:#dcfce7;
  color:#166534
}

.err{
  background:#fee2e2;
  color:#991b1b
}

.warn{
  background:#fef3c7;
  color:#92400e
}

label{
  display:block;
  font-weight:700;
  font-size:14px;
  margin:10px 0
}

input,select,textarea,button{
  width:100%;
  min-height:46px;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:11px;
  font:inherit
}

label input,
label select,
label textarea{
  margin-top:5px;
  font-weight:400;
  background:#fff
}

button{
  border:0;
  background:#0f766e;
  color:#fff;
  font-weight:800;
  cursor:pointer;
  touch-action:manipulation
}

.secondary{
  background:#e2e8f0;
  color:#172033
}

.danger{
  background:#fee2e2;
  color:#991b1b
}

.success{
  background:#dcfce7;
  color:#166534
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.row>*{
  flex:1;
  min-width:0
}

.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px
}

.stat{
  background:#f1f5f9;
  border-radius:13px;
  padding:13px;
  text-align:center
}

.red{
  color:#dc2626;
  font-weight:800
}

.green{
  color:#16a34a;
  font-weight:800
}

.item{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:12px;
  margin:9px 0
}

.item.low{
  border-color:#ef4444;
  background:#fff8f8
}

.pill{
  float:right;
  background:#e2e8f0;
  border-radius:20px;
  padding:4px 8px;
  font-size:12px
}

.tag{
  display:inline-block;
  background:#eef2ff;
  border-radius:20px;
  padding:3px 7px;
  font-size:12px
}

.empty{
  text-align:center;
  padding:25px;
  color:#64748b
}

.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px
}

.sectionTitle button{
  width:auto
}

.nav{
  position:fixed;
  z-index:20;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(720px,100%);
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:3px;
  padding:7px 4px calc(7px + env(safe-area-inset-bottom));
  background:#fff;
  border-top:1px solid #ddd
}

.nav button{
  min-height:48px;
  padding:5px 2px;
  background:#fff;
  color:#64748b;
  font-size:11px
}

.nav button.active{
  background:#0f766e;
  color:#fff
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px
}

.topbar button{
  width:auto
}

.authHero{
  text-align:center;
  padding:24px
}

.authLogo{
  width:70px;
  height:70px;
  margin:auto auto 8px;
  border-radius:20px;
  display:grid;
  place-items:center;
  background:#0f766e;
  color:#fff;
  font-size:32px
}

.authBrand{
  font-size:30px;
  font-weight:900
}

.authAction{
  background:#0f766e
}

.authLinks{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:12px
}

.authLinks button{
  width:auto;
  min-height:auto;
  background:none;
  color:#0f766e;
  padding:4px
}

.requiredStar{
  color:#dc2626
}

.check{
  display:flex;
  align-items:center;
  gap:8px
}

.check input{
  width:auto;
  min-height:auto
}

.alert{
  background:#fff4d6;
  border:1px solid #f1d28a;
  padding:10px;
  border-radius:12px;
  margin:8px 0
}

.stockItemActions{
  display:flex;
  gap:8px;
  margin-top:12px;
  position:relative;
  z-index:2;
  width:100%;
  pointer-events:auto
}

.stockItemActions button{
  flex:1;
  min-height:50px
}

.formActions{
  display:flex;
  gap:8px;
  position:sticky;
  bottom:0;
  background:#fff;
  padding-top:10px;
  z-index:5
}

.formActions>*{
  flex:1
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.58);
  z-index:50;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:10px;
  overflow:auto
}

.modalBox{
  width:min(650px,100%);
  background:#fff;
  border-radius:18px;
  padding:16px;
  min-height:100%;
  box-shadow:0 20px 60px rgba(15,23,42,.25)
}

.tablewrap{
  overflow:auto
}

.table{
  width:100%;
  border-collapse:collapse;
  font-size:13px
}

.table th,
.table td{
  padding:8px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
  white-space:nowrap
}

.mini{
  min-height:36px;
  padding:6px 8px;
  font-size:12px
}

.invoice{
  border:1px dashed #999;
  border-radius:12px;
  padding:18px
}

.voiceWrap{
  display:flex;
  gap:7px
}

.voiceWrap input{
  flex:1
}

.micBtn{
  width:58px;
  flex:0 0 58px;
  background:#eef2ff;
  color:#4338ca;
  font-size:20px
}

.micStatus{
  position:fixed;
  z-index:100;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  background:#111827;
  color:#fff;
  padding:10px 15px;
  border-radius:999px;
  display:none
}

.micStatus.show{
  display:block
}

@media(max-width:480px){
  .two,
  .grid{
    grid-template-columns:1fr
  }

  .wrap{
    padding:8px 8px 100px
  }

  .row{
    flex-direction:column
  }

  .row>*{
    width:100%
  }

  .stockItemActions{
    flex-direction:row
  }

  .stockItemActions button{
    width:50%
  }
}
</style>
</head>

<body>

<div class="wrap">

<div id="systemMsg" class="msg"></div>

<section id="auth" class="authWrap">

<div class="card authHero">
  <div class="authLogo">₹</div>
  <div class="authBrand">लेखो ऐप</div>
  <p class="muted">
    आपकी दुकान का <b>Stock, Sale और Khata</b> — एक ही जगह
  </p>
</div>

<div id="loginCard" class="card">

<h2>Sign In 👋</h2>

<label>
User ID <span class="requiredStar">*</span>
<input id="loginUser" autocomplete="username" required>
</label>

<label>
Password <span class="requiredStar">*</span>
<input id="loginPass" type="password" autocomplete="current-password" required>
</label>

<label class="check">
<input id="showLoginPass" type="checkbox">
Password दिखाएँ
</label>

<button id="loginBtn" class="authAction" type="button">
Sign In
</button>

<div class="authLinks">
<button id="showSignup" type="button">Sign Up</button>
<button id="showForgot" type="button">Forgot Password?</button>
</div>

</div>

<div id="signupCard" class="card hidden">

<h2>Create Account ✨</h2>

<label>
User ID <span class="requiredStar">*</span>
<input id="suUser" minlength="4" maxlength="30" required>
</label>

<label>
आपका नाम <span class="requiredStar">*</span>
<input id="suName" required>
</label>

<label>
दुकान का नाम <span class="requiredStar">*</span>
<input id="suShop" required>
</label>

<label>
मोबाइल नंबर <span class="requiredStar">*</span>
<input id="suPhone" inputmode="numeric" maxlength="10" required>
</label>

<label>
व्यवसाय <span class="requiredStar">*</span>
<select id="suProf" required>
<option value="">व्यवसाय चुनें</option>
<option>किराना</option>
<option>कपड़े</option>
<option>जूते</option>
<option>कॉस्मेटिक्स</option>
<option>मोबाइल</option>
<option>अन्य</option>
</select>
</label>

<label id="otherProfWrap" class="hidden">
व्यवसाय का विवरण
<input id="suOther">
</label>

<label>
Password <span class="requiredStar">*</span>
<input id="suPass" type="password" minlength="6" required>
</label>

<label>
Confirm Password <span class="requiredStar">*</span>
<input id="suConfirm" type="password" minlength="6" required>
</label>

<button id="signupBtn" class="authAction" type="button">
Account बनाएं
</button>

<div class="authLinks">
<button type="button" data-auth="login">← Sign In</button>
</div>

</div>

<div id="forgotCard" class="card hidden">

<h2>Forgot Password 🔐</h2>

<label>
User ID
<input id="fpUser">
</label>

<label>
Registered Mobile
<input id="fpPhone" inputmode="numeric" maxlength="10">
</label>

<label>
New Password
<input id="fpPass" type="password" minlength="6">
</label>

<label>
Confirm Password
<input id="fpConfirm" type="password" minlength="6">
</label>

<button id="forgotBtn" class="authAction" type="button">
Password बदलें
</button>

<div class="authLinks">
<button type="button" data-auth="login">← Sign In</button>
</div>

</div>

</section>

<section id="app" class="hidden">

<div class="card topbar">

<div>
<h2 id="shopName"></h2>
<div id="welcome" class="muted"></div>
</div>

<button id="topLogout" class="secondary" type="button">
Logout
</button>

</div>

<main id="content"></main>

<nav id="nav">

<button data-page="home">🏠<br>Home</button>
<button data-page="stock">📦<br>Stock</button>
<button data-page="sale">🧾<br>Sale</button>
<button data-page="khata">📒<br>Khata</button>
<button data-page="reports">📊<br>Reports</button>
<button data-page="account">👤<br>Account</button>

</nav>

</section>

</div>

<div id="micStatus" class="micStatus"></div>

<script>
'use strict';

(()=>{
const KEY='lekho_local_v1';

let db={
  users:{},
  current:null
};

let page='home';
let voiceTarget='';

const $=id=>document.getElementById(id);

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

const today=()=>new Date().toISOString().slice(0,10);

const esc=s=>String(s??'').replace(
  /[&<>"']/g,
  m=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[m])
);

const money=v=>Number(v||0).toFixed(2);

function msg(t,type='ok'){
  const e=$('systemMsg');
  e.textContent=t;
  e.className='msg show '+type;

  clearTimeout(msg.t);

  msg.t=setTimeout(()=>{
    e.className='msg';
  },3000);
}

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(db));
    return true;
  }catch(e){
    msg('Data save नहीं हो सका','err');
    return false;
  }
}

function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||'null');

    if(x && x.users){
      db=x;
    }
  }catch(e){
    db={
      users:{},
      current:null
    };
  }
}

function user(){
  return db.current && db.users[db.current]
    ? db.users[db.current]
    : null;
}

function authMode(mode){
  $('loginCard').classList.toggle('hidden',mode!=='login');
  $('signupCard').classList.toggle('hidden',mode!=='signup');
  $('forgotCard').classList.toggle('hidden',mode!=='forgot');
}

function openApp(){

  const u=user();

  if(!u){
    authMode('login');
    $('app').classList.add('hidden');
    $('auth').classList.remove('hidden');
    return;
  }

  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');

  $('shopName').textContent=u.shop;
  $('welcome').textContent=
    'नमस्ते '+u.name+' • '+u.prof;

  render();
}

function render(){

  document.querySelectorAll('#nav button')
    .forEach(b=>{
      b.classList.toggle(
        'active',
        b.dataset.page===page
      );
    });

  ({
    home,
    stock,
    sale,
    khata,
    reports,
    account
  }[page]||home)();
}

function home(){

  const u=user();

  const low=u.items.filter(
    x=>Number(x.qty)<=Number(x.min||0)
  );

  const due=u.khata.reduce(
    (s,x)=>s+Number(x.due||0),
    0
  );

  const sales=u.sales.filter(
    x=>String(x.date).slice(0,10)===today()
  );

  const amount=sales.reduce(
    (s,x)=>s+Number(x.total||0),
    0
  );

  $('content').innerHTML=`

  <div class="card">
    <h2>🏠 Dashboard</h2>

    <div class="grid">

      <div class="stat">
        Products<br>
        <b>${u.items.length}</b>
      </div>

      <div class="stat">
        Low Stock<br>
        <b class="red">${low.length}</b>
      </div>

      <div class="stat">
        आज बिक्री<br>
        <b>₹${money(amount)}</b>
      </div>

      <div class="stat">
        उधारी<br>
        <b class="red">₹${money(due)}</b>
      </div>

    </div>
  </div>

  <div class="card">
    <h3>Quick Actions</h3>

    <div class="row">

      <button data-go="stock">
        📦 Stock
      </button>

      <button data-go="sale">
        🧾 Sale
      </button>

      <button data-go="khata">
        📒 Khata
      </button>

    </div>
  </div>

  `;

  $('content').onclick=e=>{

    const b=e.target.closest('[data-go]');

    if(b){
      page=b.dataset.go;
      render();
    }

  };
}

function productForm(existing=null){

  const u=user();
  const x=existing||{};

  const m=document.createElement('div');

  m.className='modal';

  m.innerHTML=`

  <div class="modalBox">

    <h2>
      ${existing?'✏️ Product Edit':'➕ Product Add'}
    </h2>

    <form id="productForm">

      <label>
        Product Name *
        <input id="pName"
          value="${esc(x.name)}"
          required>
      </label>

      <div class="two">

        <label>
          Category

          <select id="pCat">

            <option>किराना</option>
            <option>कपड़े</option>
            <option>जूते</option>
            <option>कॉस्मेटिक्स</option>
            <option>मोबाइल</option>
            <option>अन्य</option>

          </select>

        </label>

        <label>
          Unit

          <input
            id="pUnit"
            value="${esc(x.unit||'pcs')}"
            placeholder="pcs / kg / litre / box">
        </label>

      </div>

      <div class="two">

        <label>
          Quantity

          <input
            id="pQty"
            type="number"
            min="0"
            step="0.01"
            value="${x.qty??0}"
            required>
        </label>

        <label>
          Low-stock limit

          <input
            id="pMin"
            type="number"
            min="0"
            step="0.01"
            value="${x.min??0}">
        </label>

      </div>

      <div class="two">

        <label>
          Buy Price ₹

          <input
            id="pBuy"
            type="number"
            min="0"
            step="0.01"
            value="${x.buy??0}">
        </label>

        <label>
          Sale Price ₹

          <input
            id="pSell"
            type="number"
            min="0"
            step="0.01"
            value="${x.sell??0}">
        </label>

      </div>

      <div class="two">

        <label>
          Brand
          <input id="pBrand" value="${esc(x.brand)}">
        </label>

        <label>
          Color / Shade
          <input
            id="pColor"
            value="${esc(x.color||x.shade)}">
        </label>

      </div>

      <div class="two">

        <label>
          Size / Number
          <input id="pSize" value="${esc(x.size)}">
        </label>

        <label>
          Design / Model
          <input
            id="pDesign"
            value="${esc(x.design||x.model)}">
        </label>

      </div>

      <label>
        Expiry (optional)

        <input
          id="pExpiry"
          type="date"
          value="${esc(x.expiry)}">
      </label>

      <label>
        Details

        <input
          id="pDetails"
          value="${esc(x.details)}">
      </label>

      <div class="row formActions">

        <button
          type="button"
          id="pCancel"
          class="secondary">
          Cancel
        </button>

        <button type="submit">
          Save
        </button>

      </div>

    </form>

  </div>
  `;

  document.body.appendChild(m);

  $('pCat').value=
    x.category||u.prof||'अन्य';

  $('pCancel').onclick=()=>{
    m.remove();
  };

  $('productForm').onsubmit=e=>{

    e.preventDefault();

    const data={

      id:x.id||uid(),

      name:$('pName').value.trim(),

      category:$('pCat').value,

      unit:$('pUnit').value.trim()||'pcs',

      qty:Number($('pQty').value)||0,

      min:Number($('pMin').value)||0,

      buy:Number($('pBuy').value)||0,

      sell:Number($('pSell').value)||0,

      brand:$('pBrand').value.trim(),

      color:$('pColor').value.trim(),

      size:$('pSize').value.trim(),

      design:$('pDesign').value.trim(),

      expiry:$('pExpiry').value,

      details:$('pDetails').value.trim()

    };

    if(!data.name||data.qty<0){
      msg('Product details सही भरें','err');
      return;
    }

    if(existing){

      const i=u.items.findIndex(
        z=>z.id===x.id
      );

      if(i>=0){
        u.items[i]=data;
      }

    }else{

      u.items.push(data);

    }

    if(save()){

      m.remove();

      stock();

      msg(
        existing
          ?'Product update हो गया ✓'
          :'Product add हो गया ✓'
      );

    }

  };
}

function stock(){

  const u=user();

  $('content').innerHTML=`

  <div class="card">

    <div class="sectionTitle">

      <div>
        <h2>📦 पूरा Stock</h2>

        <div class="muted">
          कुल ${u.items.length} products
        </div>
      </div>

      <button id="addItem">
        + Add Product
      </button>

    </div>

    <input
      id="stockSearch"
      placeholder="Product, brand, color, model खोजें…">

    <div id="stockAlerts"></div>

    <div id="stockList"></div>

  </div>

  `;

  $('addItem').onclick=()=>{
    productForm();
  };

  function draw(){

    const q=$('stockSearch')
      .value
      .toLowerCase();

    const a=u.items.filter(x=>
      JSON.stringify(x)
        .toLowerCase()
        .includes(q)
    );

    const low=u.items.filter(
      x=>Number(x.qty)<=Number(x.min||0)
    );

    $('stockAlerts').innerHTML=
      low.length
      ?`
        <div class="alert">
          ⚠️ Low Stock:
          <b>${low.length}</b> product(s)
        </div>
      `
      :'';

    $('stockList').innerHTML=

      a.length

      ?a.map(x=>`

        <div class="item
          ${Number(x.qty)<=Number(x.min||0)
            ?'low'
            :''
          }">

          <b>${esc(x.name)}</b>

          <span class="pill">
            ${money(x.qty)}
            ${esc(x.unit)}
          </span>

          <div class="muted">
            ${
              [
                x.category,
                x.brand,
                x.color,
                x.size,
                x.design,
                x.details
              ]
              .filter(Boolean)
              .map(esc)
              .join(' • ')
            }
          </div>

          <div>
            खरीद ₹${money(x.buy)}
            •
            बिक्री ₹${money(x.sell)}
          </div>

          <div class="stockItemActions">

            <button
              class="secondary"
              data-edit="${x.id}">
              ✏️ Edit
            </button>

            <button
              class="danger"
              data-del="${x.id}">
              🗑️ Delete
            </button>

          </div>

        </div>

      `).join('')

      :`
        <div class="empty">
          कोई product नहीं मिला।
        </div>
      `;
  }

  draw();

  $('stockSearch').oninput=draw;

  $('stockList').onclick=e=>{

    const b=e.target.closest('button');

    if(!b)return;

    const x=u.items.find(
      z=>z.id===(b.dataset.edit||b.dataset.del)
    );

    if(!x)return;

    if(b.dataset.edit){

      productForm(x);

    }else{

      if(!confirm(
        'क्या '+x.name+' को delete करना है?'
      ))return;

      u.items=u.items.filter(
        z=>z.id!==x.id
      );

      if(save()){

        draw();

        msg(
          'Product delete हो गया ✓'
        );

      }

    }

  };
}

function sale(){

  const u=user();

  $('content').innerHTML=`

          </option>

            Credit / उधार
          </option>

        </select>

      </label>

      <div
        id="creditFields"

        <label>
          Customer Name

        </label>

        <div class="two">

          <label>
            Received ₹

            <input
              id="saleReceived"
              type="number"
              min="0"
              step="0.01"
              value="0">
          </label>

          <label>
            Promise Date

            <input
              id="salePromise"
              type="date">
          </label>

        </div>

      </div>

      <label>
        Sale Date

        <input
          id="saleDate"
          type="date"
          value="${today()}"
          required>
      </label>

      <div id="saleTotal" class="stat">
        Total: ₹0.00
      </div>

      <div class="row formActions">

        <button
          type="button"
          id="saleCancel"
          class="secondary">
          Cancel
        </button>

        <button type="submit">
          ✓ बिक्री दर्ज करें
        </button>

      </div>

    </form>

  </div>

  <div class="card">

    <h3>आज की बिक्री</h3>

    <div id="todaySales"></div>

  </div>

  `;

  $('saleProduct').onchange=()=>{

    const x=u.items.find(
      z=>z.id===$('saleProduct').value
    );

    $('salePrice').value=
      x?x.sell:'';

    calc();

  };

  function calc(){

    const q=
      Number($('saleQty').value)||0;

    const r=
      Number($('salePrice').value)||0;

    $('saleTotal').textContent=
      'Total: ₹'+money(q*r);
  }

  $('saleQty').oninput=calc;
  $('salePrice').oninput=calc;

  $('salePay').onchange=()=>{

    $('creditFields')
      .classList
      .toggle(
        'hidden',
        $('salePay').value!=='credit'
      );

  };

  $('saleCancel').onclick=()=>{
    page='home';
    render();
  };

  $('saleForm').onsubmit=e=>{

    e.preventDefault();

    const x=u.items.find(
      z=>z.id===$('saleProduct').value
    );

    const q=
      Number($('saleQty').value);

    const rate=
      Number($('salePrice').value);

    const pay=
      $('salePay').value;

    const customer=
      $('saleCustomer').value.trim();

    const received=
      Number($('saleReceived').value)||0;

    if(!x)
      return msg(
        'पहले Product चुनें',
        'err'
      );

    if(!q||q>x.qty)
      return msg(
        'Quantity/Stock सही भरें',
        'err'
      );

    if(!Number.isFinite(rate)||rate<0)
      return msg(
        'Sale price सही भरें',
        'err'
      );

    const total=q*rate;

    if(pay==='credit'&&!customer)
      return msg(
        'उधार के लिए Customer Name डालें',
        'err'
      );

    if(pay==='credit'&&received>total)
      return msg(
        'Received total से ज्यादा नहीं हो सकता',
        'err'
      );

    const s={

      id:uid(),

      date:
        $('saleDate').value+
        'T12:00:00',

      itemId:x.id,

      item:x.name,

      qty:q,

      rate,

      total,

      pay,

      customer

    };

    x.qty-=q;

    if(pay==='credit'){

      const k={

        id:uid(),

        saleId:s.id,

        customer,

        itemId:x.id,

        item:x.name,

        total,

        paid:received,

        due:Math.max(0,total-received),

        promise:$('salePromise').value,

        date:s.date

      };

      s.khataId=k.id;

      u.khata.push(k);

    }

    u.sales.push(s);

    if(save()){

      e.target.reset();

      $('saleQty').value=1;

      $('saleDate').value=today();

      $('creditFields')
        .classList
        .add('hidden');

      sale();

      msg(
        'बिक्री दर्ज हो गई ✓ Stock भी कम हुआ'
      );

    }

  };

  drawToday();

  function drawToday(){

    const a=u.sales.filter(
      x=>String(x.date).slice(0,10)===today()
    );

    $('todaySales').innerHTML=

      a.length

      ?a.slice().reverse().map(x=>`

        <div class="item">

          <b>${esc(x.item)}</b>

          • ${x.qty}

          • ₹${money(x.total)}

          • ${
            x.pay==='credit'
              ?'📒 Credit'
              :'💵 Cash'
          }

        </div>

      `).join('')

      :`
        <div class="empty">
          आज अभी कोई बिक्री नहीं हुई।
        </div>
      `;
  }
}

function khata(){

  const u=user();

  $('content').innerHTML=`

  <div class="card">

    <h2>📒 Khata / उधारी</h2>

    <input
      id="khataSearch"
      placeholder="Customer या item खोजें…">

    <div id="khataList"></div>

  </div>

  `;

  function draw(){

    const q=
      $('khataSearch')
      .value
      .toLowerCase();

    const a=u.khata.filter(
      x=>
        (x.customer+' '+x.item)
        .toLowerCase()
        .includes(q)
    );

    const due=a.reduce(
      (s,x)=>s+Number(x.due||0),
      0
    );

    $('khataList').innerHTML=

      '<div class="stat">'+
      'दिख रही उधारी: '+
      '<b class="red">₹'+
      money(due)+
      '</b></div>'+

      (

        a.length

        ?a.map(x=>`

          <div class="item">

            <b>${esc(x.customer)}</b>

            <span class="tag">
              ${esc(x.item)}
            </span>

            <p>
              कुल ₹${money(x.total)}
              • Paid ₹${money(x.paid)}
              •
              <span class="red">
                बाकी ₹${money(x.due)}
              </span>
            </p>

            <label>
              Paid Amount

              <input
                data-paid="${x.id}"
                type="number"
                min="0"
                max="${x.total}"
                step="0.01"
                value="${x.paid}">
            </label>

            <label>
              Promise Date

              <input
                data-promise="${x.id}"
                type="date"
                value="${esc(x.promise||'')}">
            </label>

            <div class="row">

              <button data-update="${x.id}">
                Update
              </button>

              <button
                class="success"
                data-full="${x.id}">
                पूरा Payment मिला
              </button>

            </div>

          </div>

        `).join('')

        :`
          <div class="empty">
            अभी कोई उधारी नहीं है।
          </div>
        `
      );
  }

  draw();

  $('khataSearch').oninput=draw;

  $('khataList').onclick=e=>{

    const b=e.target.closest('button');

    if(!b)return;

    const x=u.khata.find(
      z=>z.id===(b.dataset.update||b.dataset.full)
    );

    if(!x)return;

    if(b.dataset.full){

      x.paid=Number(x.total);
      x.due=0;

    }else{

      const p=Math.min(
        Number(x.total),
        Math.max(
          0,
          Number(
            document.querySelector('[data-paid="'+x.id+'"]').value
          )||0
        )
      );

      x.paid=p;
      x.due=Number(x.total)-p;

      x.promise=
        $('[data-promise="'+x.id+'"]').value;
    }

    if(x.due<=0){

      u.khata=u.khata.filter(
        z=>z.id!==x.id
      );

    }

    if(save()){

      draw();

      msg(
        x.due<=0
          ?'पूरा Payment हो गया ✓ Khata से entry हट गई'
          :'Khata update हो गया ✓'
      );

    }

  };
}

function download(text,name,type){

  const a=document.createElement('a');

  const url=URL.createObjectURL(
    new Blob([text],{type})
  );

  a.href=url;
  a.download=name;

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1000
  );
}

function startVoice(id){

  voiceTarget=id;

  $('micStatus').textContent=
    '🎤 सुन रहा हूँ…';

  $('micStatus')
    .classList
    .add('show');

  if(
    window.LekhoMic &&
    window.LekhoMic.startListening
  ){

    window.LekhoMic.startListening(id);

  }else if(
    'webkitSpeechRecognition' in window ||
    'SpeechRecognition' in window
  ){

    const R=
      window.SpeechRecognition||
      window.webkitSpeechRecognition;

    const r=new R();

    r.lang='hi-IN';
    r.interimResults=false;
    r.maxAlternatives=1;

    r.onresult=e=>{

      setMicText(
        id,
        e.results[0][0].transcript
      );

    };

    r.onerror=()=>{
      micError('आवाज़ समझ नहीं आई');
    };

    r.onend=()=>{
      $('micStatus')
        .classList
        .remove('show');
    };

    r.start();

  }else{

    micError(
      'इस फोन में voice recognition उपलब्ध नहीं है'
    );

  }
}

window.setMicText=(id,text)=>{

  const e=$(id);

  if(e && e.tagName==='INPUT')
    e.value=text;

  $('micStatus')
    .classList
    .remove('show');

  msg(
    'आवाज़ दर्ज हो गई ✓'
  );
};

window.micError=t=>{

  $('micStatus')
    .classList
    .remove('show');

};

$('signupBtn').onclick=()=>{

  const id=
    $('suUser')
      .value
      .trim()
      .toLowerCase();

  const name=
    $('suName').value.trim();

  const shop=
    $('suShop').value.trim();

  const phone=
    $('suPhone')
      .value
      .replace(/\D/g,'');

  const prof=
    $('suProf').value;

  const pass=
    $('suPass').value;

  if(!/^[a-z0-9_]{4,30}$/.test(id))
    return msg(
      'User ID 4–30 letters/numbers/_ रखें',
      'err'
    );

  if(db.users[id])
    return msg(
      'यह User ID पहले से मौजूद है',
      'err'
    );

  if(!/^\d{10}$/.test(phone))
    return msg(
      '10 digit mobile number डालें',
      'err'
    );

  if(!name||!shop)
    return msg(
      'नाम और दुकान का नाम भरें',
      'err'
    );

  if(!prof)
    return msg(
      'व्यवसाय चुनें',
      'err'
    );

  if(pass.length<6)
    return msg(
      'Password कम से कम 6 अक्षर का रखें',
      'err'
    );

  if(pass!==$('suConfirm').value)
    return msg(
      'Password और Confirm Password अलग हैं',
      'err'
    );

  db.users[id]={

    userId:id,

    name,

    shop,

    phone,

    prof:
      prof==='अन्य'
        ?($('suOther').value.trim()||'अन्य')
        :prof,

    password:pass,

    items:[],

    sales:[],

    khata:[]

  };

  db.current=null;

  if(save()){

    authMode('login');

    $('loginUser').value=id;

    $('loginPass').value='';

    msg(
      'Account बन गया ✓ अब Sign In करें'
    );
  }
};

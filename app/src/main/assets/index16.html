<script>'use strict';
(function(){
const KEY='lekhoMVP25';const APP_VERSION='1.0-MVP';let db={users:{},current:null};let page='home';const $=id=>document.getElementById(id);
function showMsg(text,type='ok'){const modal=document.querySelector('.productModal');const inApp=document.getElementById('app')&&!document.getElementById('app').classList.contains('hidden');if(type==='err'&&modal){const box=modal.querySelector('.productBox');let e=modal.querySelector('.inlineMsg');if(!e){e=document.createElement('div');e.className='inlineMsg';box.insertBefore(e,box.firstChild)}e.textContent=text;e.classList.add('show');clearTimeout(showMsg.t);showMsg.t=setTimeout(()=>e.remove(),5000);return}if(inApp){let e=document.getElementById('pageMsg');if(!e){e=document.createElement('div');e.id='pageMsg';e.className='msg pageMsg'}e.textContent=text;e.className='msg show pageMsg floatingMsg '+type;document.body.appendChild(e);clearTimeout(showMsg.pageT);showMsg.pageT=setTimeout(()=>e.remove(),5000);return}const e=$('systemMsg');e.textContent=text;e.className='msg show '+type;clearTimeout(showMsg.t);showMsg.t=setTimeout(()=>{e.className='msg'},4000)}
window.addEventListener('error',e=>showMsg('App error: '+e.message,'err'));window.addEventListener('unhandledrejection',e=>showMsg('App error: '+String(e.reason),'err'));
function safeLoad(){try{let r=window.localStorage?.getItem(KEY);if(!r)r=window.sessionStorage?.getItem(KEY);if(r){const x=JSON.parse(r);if(x&&x.users&&typeof x.users==='object'){db=x;if(!db.current)db.current=null;return true}}}catch(e){}db={users:{},current:null};return false}
function safeSave(){const data=JSON.stringify(db);let saved=false;try{if(window.localStorage){window.localStorage.setItem(KEY,data);saved=window.localStorage.getItem(KEY)===data}}catch(e){}if(!saved){try{if(window.sessionStorage){window.sessionStorage.setItem(KEY,data);saved=window.sessionStorage.getItem(KEY)===data}}catch(e){}}return saved}
function current(){return db.current&&db.users[db.current]?db.users[db.current]:null}function cleanPhone(v){return String(v||'').replace(/\D/g,'').slice(0,10)}
function uid(){try{if(window.crypto&&typeof window.crypto.randomUUID==='function')return window.crypto.randomUUID()}catch(e){}return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2)}
function localISODate(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}
function authMode(mode){$('loginCard').style.display=mode==='login'?'block':'none';$('signupCard').classList.toggle('hidden',mode!=='signup');$('forgotCard').style.display=mode==='forgot'?'block':'none';$('systemMsg').className='msg'}
function openApp(){const u=current();if(!u)return authMode('login');u.items=Array.isArray(u.items)?u.items:[];u.sales=Array.isArray(u.sales)?u.sales:[];u.khata=Array.isArray(u.khata)?u.khata:[];safeSave();$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('shopName').textContent=u.shop;$('welcome').textContent='नमस्ते '+u.name+' • '+u.prof;render()}
function logout(){db.current=null;safeSave();$('app').classList.add('hidden');$('auth').classList.remove('hidden');authMode('login');showMsg('Logout हो गया ✓')}
$('showSignup').addEventListener('click',()=>authMode('signup'));
$('showForgot').addEventListener('click',()=>authMode('forgot'));
$('backLogin').addEventListener('click',()=>authMode('login'));$('signupBackBtn').addEventListener('click',()=>authMode('login'));
$('showLoginPass').addEventListener('change',()=>{$('loginPass').type=$('showLoginPass').checked?'text':'password'});
$('loginBtn').addEventListener('click',()=>{try{const id=$('loginUser').value.trim().toLowerCase(),pass=$('loginPass').value;if(!id||!pass)return showMsg('User ID और Password दोनों डालें','err');const key=Object.keys(db.users).find(k=>k===id||cleanPhone(db.users[k].phone)===cleanPhone(id));if(!key){if(/^\d{10}$/.test(id))return showMsg('Mobile number गलत है। सही 10 अंकों का नंबर डालें।','err');return showMsg('User ID नहीं मिली। पहले Sign Up करें।','err')}if(db.users[key].password!==pass)return showMsg('Password गलत है।','err');db.current=key;safeSave();page='home';openApp();showMsg('Sign In सफल ✓')}catch(x){showMsg('Sign In error: '+x.message,'err')}});
$('signupBtn').addEventListener('click',()=>{try{const id=$('suUser').value.trim().toLowerCase(),name=$('suName').value.trim(),shop=$('suShop').value.trim(),p=cleanPhone($('suPhone').value),prof=$('suProf').value,pass=$('suPass').value,conf=$('suConfirm').value;if(!/^\S{4,30}$/.test(id))return showMsg('User ID 4–30 अक्षर/अंक की रखें, बिना space के','err');if(db.users[id])return showMsg('यह User ID पहले से मौजूद है','err');if(name.length<2||shop.length<2)return showMsg('नाम और दुकान का नाम डालें','err');if(p.length!==10)return showMsg('सही 10 अंकों का मोबाइल नंबर डालें','err');if(!prof)return showMsg('व्यवसाय चुनें','err');if(pass.length<6)return showMsg('Password कम से कम 6 अक्षर का रखें','err');if(pass!==conf)return showMsg('दोनों Password समान होने चाहिए','err');db.users[id]={userId:id,name,shop,phone:p,prof,password:pass,items:[],sales:[],khata:[]};db.current=id;if(!safeSave()){delete db.users[id];db.current=null;return showMsg('Account save नहीं हो पाया। कृपया फिर से कोशिश करें।','err')}openApp();showMsg('Account बन गया ✓')}catch(x){showMsg('Account error: '+x.message,'err')}});
let fpVerificationId=null;$('fpSendOtp').addEventListener('click',()=>{const id=$('fpUser').value.trim().toLowerCase(),phone=cleanPhone($('fpPhone').value),u=db.users[id];if(!id)return showMsg('User ID / यूज़र आईडी खाली है।','err');if(!u)return showMsg('User ID गलत है या account नहीं मिला।','err');if(phone.length!==10)return showMsg('Mobile Number / मोबाइल नंबर गलत है। 10 अंक डालें।','err');if(cleanPhone(u.phone)!==phone)return showMsg('Mobile Number / मोबाइल नंबर account से match नहीं करता।','err');if(!window.AndroidSpeech||typeof window.AndroidSpeech.sendOtp!=='function')return showMsg('OTP सुविधा अभी उपलब्ध नहीं है।','err');$('fpOtpHint').textContent='OTP भेजा जा रहा है…';window.__otpSent=id=>{fpVerificationId=id;$('fpOtpHint').textContent='OTP SMS में भेज दिया गया है।';showMsg('OTP भेज दिया गया ✓')};window.__otpError=msg=>{fpVerificationId=null;$('fpOtpHint').textContent='';showMsg(msg||'OTP भेजा नहीं जा सका।','err')};window.AndroidSpeech.sendOtp('+91'+phone)});$('forgotBtn').addEventListener('click',()=>{const id=$('fpUser').value.trim().toLowerCase(),phone=cleanPhone($('fpPhone').value),code=$('fpOtp').value.trim(),pass=$('fpPass').value,conf=$('fpConfirm').value,u=db.users[id];if(!id)return showMsg('User ID / यूज़र आईडी खाली है।','err');if(!u)return showMsg('User ID गलत है या account नहीं मिला।','err');if(phone.length!==10)return showMsg('Mobile Number / मोबाइल नंबर गलत है। 10 अंक डालें।','err');if(cleanPhone(u.phone)!==phone)return showMsg('Mobile Number / मोबाइल नंबर account से match नहीं करता।','err');if(!fpVerificationId)return showMsg('पहले OTP भेजें।','err');if(!/^\d{6}$/.test(code))return showMsg('सही 6 digit OTP डालें।','err');if(!pass)return showMsg('New Password / नया Password खाली है।','err');if(pass.length<6)return showMsg('Password कम से कम 6 अक्षर का रखें','err');if(pass!==conf)return showMsg('दोनों Password समान होने चाहिए','err');window.__otpVerified=()=>{const before=u.password;u.password=pass;if(!safeSave()){u.password=before;return showMsg('Password save नहीं हुआ। कृपया फिर से कोशिश करें।','err')}showMsg('OTP verified और Password बदल गया ✓');setTimeout(()=>authMode('login'),700)};window.__otpError=msg=>showMsg(msg||'OTP गलत है या expire हो गया।','err');window.AndroidSpeech.verifyOtp(fpVerificationId,code)});
$('topLogout').addEventListener('click',logout);
function specs(prof){const common={kirana:[['name','Product / Item','text'],['brand','Brand','text'],['qty','Quantity','number'],['unit','Unit','select','kg,gram,litre,packet,box,bottle,piece'],['min','Minimum Stock','number'],['buy','Purchase Price','number'],['sell','Selling Price','number'],['expiry','Expiry','date']],cloth:[['name','Product / Name','text'],['brand','Brand','text'],['color','Color','text'],['design','Design','text'],['size','Size','text'],['qty','Quantity','number'],['unit','Unit','select','meter,piece'],['min','Minimum Stock','number'],['buy','Purchase Price','number'],['sell','Selling Price','number']],shoe:[['name','Model / Name','text'],['brand','Brand','text'],['size','Size / Number','text'],['color','Color','text'],['qty','Quantity','number'],['unit','Unit','select','pair,piece'],['min','Minimum Stock','number'],['buy','Purchase Price','number'],['sell','Selling Price','number']],cos:[['category','Category','select','Lipstick,Foundation,Compact,Kajal,Nail Paint,Face Wash,Other'],['name','Product / Lipstick Name','text'],['brand','Brand','text'],['color','Color / Shade','text'],['shade','Shade No.','text'],['qty','Quantity','number'],['unit','Unit','select','piece,box,bottle'],['min','Minimum Stock','number'],['buy','Purchase Price','number'],['sell','Selling Price','number'],['expiry','Expiry','date']],mobile:[['name','Product','text'],['brand','Brand','text'],['model','Model','text'],['ram','RAM','text'],['storage','Storage','text'],['color','Color','text'],['imei','IMEI / Serial','text'],['warranty','Warranty','text'],['qty','Quantity','number'],['unit','Unit','select','piece'],['min','Minimum Stock','number'],['buy','Purchase Price','number'],['sell','Selling Price','number']],other:[['name','Product / Item','text'],['category','Category','select','General,Other'],['details','Details','text'],['brand','Brand','text'],['qty','Quantity','number'],['unit','Unit','select','piece,kg,gram,litre,packet,box,meter,pair'],['min','Minimum Stock','number'],['buy','Purchase Price','number'],['sell','Selling Price','number'],['expiry','Expiry','date']]};return common[{किराना:'kirana',कपड़े:'cloth',जूते:'shoe',कॉस्मेटिक्स:'cos',मोबाइल:'mobile',अन्य:'other'}[prof]||'other']}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function formHtml(item={}){return '<form id="itemForm"><div class="two">'+specs(current().prof).map(([k,l,t,opt])=>{const val=esc(item[k]??'');if(t==='select')return '<label>'+l+'<select data-f="'+k+'">'+opt.split(',').map(v=>'<option '+(String(item[k]??'')===v?'selected':'')+' value="'+esc(v)+'">'+esc(v)+'</option>').join('')+'</select></label>';const input='<input data-f="'+k+'" type="'+t+'" value="'+val+'" '+(['qty','min','buy','sell'].includes(k)?'min="0" step="0.01"':'')+'>';return '<label>'+l+input+'</label>'}).join('')+'</div><div class="voiceAll"><button type="button" class="micBtn voiceAllBtn" id="smartStockMic">🎤</button><div class="voiceAllText"><b>एक बार बोलकर पूरा Product भरें</b>जैसे: “नाम आटा, ब्रांड आशीर्वाद, मात्रा 10 किलो, खरीद 400, बिक्री 450” — बोलने के बाद नीचे Save दबाएँ</div></div><div class="row formActions stockFormActions"><button type="button" id="stockCancel" class="cancelBtn">Cancel / वापस</button><button type="submit">✓ Save Product</button></div></form>'}
function setupConditionalFields(root){const cat=root.querySelector('[data-f=category]');if(!cat)return;const name=root.querySelector('[data-f=name]')?.closest('label');const details=root.querySelector('[data-f=details]')?.closest('label');const toggle=()=>{const other=cat.value==='Other';if(details)details.style.display=other?'block':'none';if(name&&current().prof==='कॉस्मेटिक्स')name.style.display=other?'block':'block'};cat.addEventListener('change',toggle);toggle()}
function nativeSpeechAvailable(){return !!(window.AndroidSpeech&&typeof window.AndroidSpeech.startSpeech==='function')}
function voiceSupported(){return nativeSpeechAvailable()||!!(window.SpeechRecognition||window.webkitSpeechRecognition)}
function voiceEnvironmentOK(){if(nativeSpeechAvailable())return true;if(!voiceSupported())return false;if(window.isSecureContext===false&&location.protocol!=='file:'){showMsg('Mic के लिए HTTPS वाला लिंक खोलें।','err');return false}return true}
async function prepareMic(){if(nativeSpeechAvailable())return true;try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return true;const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop());return true}catch(e){const m=e&&e.name==='NotAllowedError'?'Microphone permission Allow करें।':e&&e.name==='NotFoundError'?'फोन में Microphone उपलब्ध नहीं है।':'Microphone शुरू नहीं हो पाया: '+(e&&e.name||'unknown');showMsg(m,'err');return false}}
function showMicStatus(text){let el=$('micStatus');if(!el){el=document.createElement('div');el.id='micStatus';el.className='micStatus';document.body.appendChild(el)}el.innerHTML=text;el.classList.add('show');clearTimeout(window.__micTimer);window.__micTimer=setTimeout(()=>el.classList.remove('show'),2500)};window.showMicStatus=showMicStatus
window.__nativeSpeechResult=function(text){try{if(typeof window.__lekhoSpeechCallback==='function')window.__lekhoSpeechCallback(String(text||''))}catch(e){showMsg('Voice data भरते समय error आया।','err')}};
window.__nativeSpeechError=function(msg){window.__lekhoSpeechCallback=null;document.querySelectorAll('.micBtn.listening').forEach(b=>b.classList.remove('listening'));showMsg(String(msg||'Voice input शुरू नहीं हो पाया।'),'err')};
function startVoiceInput(input){if(!voiceEnvironmentOK()){showMsg('आपके Browser में Voice Typing support नहीं है। Chrome में कोशिश करें।','err');return}const btn=input.closest('.voiceWrap')?.querySelector('.micBtn');if(btn)btn.classList.add('listening');showMicStatus('🎤 <b>सुन रहा हूँ…</b> बोलिए');if(nativeSpeechAvailable()){window.__lekhoSpeechCallback=text=>{text=text.trim();if(!text)return;input.value=input.value?input.value+' '+text:text;input.dispatchEvent(new Event('input',{bubbles:true}));showMicStatus('✓ सुना: '+esc(text));if(btn)btn.classList.remove('listening');if(input.id==='askLekho'&&$('askBtn'))$('askBtn').click()};window.AndroidSpeech.startSpeech();return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const r=new SR();r.lang='hi-IN';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{let text='';for(let i=e.resultIndex||0;i<e.results.length;i++){if(e.results[i].isFinal)text+=e.results[i][0].transcript+' '}text=text.trim();if(text){input.value=input.value?input.value+' '+text:text;input.dispatchEvent(new Event('input',{bubbles:true}));showMicStatus('✓ सुना: '+esc(text));if(input.id==='askLekho'&&$('askBtn'))$('askBtn').click()}};r.onerror=e=>showMsg(e.error==='not-allowed'?'Microphone permission allow करें।':e.error==='no-speech'?'आवाज़ नहीं मिली, फिर से Mic दबाएँ।':'Voice input शुरू नहीं हो पाया।','err');r.onend=()=>{if(btn)btn.classList.remove('listening')};try{r.start()}catch(e){if(btn)btn.classList.remove('listening');showMsg('Microphone अभी busy है। फिर कोशिश करें।','err')}}
function startSmartVoice(target){
 const btn=document.getElementById(target);
 if(btn)btn.classList.add('listening');
 showMicStatus('🎤 <b>सुन रहा हूँ…</b> पूरा वाक्य बोलिए');
 const handle=text=>{
  text=String(text||'').trim();
  if(!text){showMsg('आवाज़ समझ नहीं आई, फिर से Mic दबाएँ।','err');if(btn)btn.classList.remove('listening');return}
  if(target==='smartStockMic'){
   const root=btn&&btn.closest('.productBox');
   fillSmartStock(root,text);
  }else if(target==='smartSaleMic'){
   fillSmartSale(text,'sale');
  }else if(target==='smartEditMic'){
   fillSmartSale(text,'edit');
  }
  showMicStatus('✓ डेटा समझ लिया: '+esc(text));
  if(btn)btn.classList.remove('listening');
 };
 if(nativeSpeechAvailable()){
  window.__lekhoSpeechCallback=handle;
  window.AndroidSpeech.startSpeech();
  return;
 }
 if(!voiceSupported()){
  if(btn)btn.classList.remove('listening');
  showMsg('Voice Recognition उपलब्ध नहीं है।','err');
  return;
 }
 prepareMic().then(ok=>{
  if(!ok){if(btn)btn.classList.remove('listening');return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const r=new SR();
  r.lang='hi-IN';r.interimResults=false;r.continuous=false;r.maxAlternatives=1;
  r.onstart=()=>showMicStatus('🎤 <b>Mic चालू है…</b> अब बोलिए');
  r.onresult=e=>{
   let text='';
   for(let i=e.resultIndex||0;i<e.results.length;i++)if(e.results[i].isFinal)text+=e.results[i][0].transcript+' ';
   handle(text);
  };
  r.onerror=e=>{

$('content').innerHTML='<div class="card"><h2>🧾 नई बिक्री</h2><p class="muted">किसी भी तारीख की Sale दर्ज करें। पुरानी Sale के लिए भी Date चुन सकते हैं।</p><div class="alert">🎤 <b>Voice Typing:</b> जहाँ 🎤 <b>बोलें</b> दिखे, वहाँ tap करके हिंदी में बोलें।</div><div class="voiceAll"><button type="button" class="micBtn voiceAllBtn" id="smartSaleMic">🎤</button><div class="voiceAllText"><b>एक बार बोलकर Sale भरें</b>जैसे: “आटा मात्रा 2 कीमत 450 cash” या “आटा 2 450 उधार”</div></div><form id="saleForm"><label>बिक्री की तारीख <input id="saleDate" type="date" value="'+localISODate()+'" required></label><label>Product <select id="saleProduct" required><option value="">Product चुनें</option>'+u.items.map(x=>'<option value="'+x.id+'">'+esc(x.name)+' — Stock '+x.qty+' — बिक्री ₹'+money(x.sell)+'</option>').join('')+'</select></label><div class="two"><label>Quantity<input id="saleQty" type="number" min="0.01" step="0.01" value="1" inputmode="decimal" required></label><label>बिक्री कीमत / यूनिट (₹)<input id="salePrice" type="number" min="0" step="0.01" inputmode="decimal" required></label></div><div class="priceBox"><div class="muted">कुल बिक्री रकम</div><div id="saleTotal" class="totalBox">₹0.00</div></div><label>Payment Method<select id="salePay"><option value="paid">💵 Cash / पूरा Paid</option><option value="credit">📒 Credit / उधार</option></select></label><label>GST / जीएसटी <select id="saleGst"><option value="0">GST नहीं</option><option value="5">5%</option><option value="12">12%</option><option value="18">18%</option><option value="28">28%</option></select></label><div class="priceBox"><div>GST: <b id="saleGstAmount">₹0.00</b></div><div>Bill Total: <b id="saleBillTotal">₹0.00</b></div></div><div id="creditFields" class="hidden"><label>Customer Name <input id="saleCustomer" placeholder="उधार किस ग्राहक की है?"></label><div class="two"><label>अभी मिला Payment (₹)<input id="saleReceived" type="number" min="0" step="0.01" value="0" inputmode="decimal"></label><label>वादा तारीख <input id="salePromise" type="date"></label></div><div class="priceBox"><b>बाकी उधारी: </b><span id="saleDue">₹0.00</span></div></div><div class="row"><button type="submit">✓ बिक्री दर्ज करें</button><button type="button" id="saleCancel" class="cancelBtn">Cancel / वापस</button></div></form></div><div class="card"><div class="sectionTitle"><h3>आज की बिक्री</h3><span class="tag" id="saleCount">0 बिक्री</span></div><div id="todaySales"></div></div>';
const selected=()=>u.items.find(i=>i.id===$('saleProduct').value);
function calc(){const q=Number($('saleQty').value)||0,p=Number($('salePrice').value)||0,base=q*p,gst=Number($('saleGst')?.value||0),gstAmt=base*gst/100,total=base+gstAmt,received=Math.max(0,Number($('saleReceived').value)||0);$('saleTotal').textContent='₹'+base.toFixed(2);if($('saleGstAmount'))$('saleGstAmount').textContent='₹'+gstAmt.toFixed(2);if($('saleBillTotal'))$('saleBillTotal').textContent='₹'+total.toFixed(2);$('saleDue').textContent='₹'+Math.max(0,total-received).toFixed(2)}
$('saleCancel').addEventListener('click',()=>{page='home';render();window.scrollTo(0,0)});
$('saleProduct').addEventListener('change',()=>{const x=selected();$('salePrice').value=x?Number(x.sell||0):'';calc()});
$('saleQty').addEventListener('input',calc);$('salePrice').addEventListener('input',calc);if($('saleGst'))$('saleGst').addEventListener('change',calc);$('saleReceived').addEventListener('input',calc);$('salePay').addEventListener('change',()=>{$('creditFields').classList.toggle('hidden',$('salePay').value!=='credit');calc()});$('smartSaleMic').onclick=()=>startSmartVoice('smartSaleMic');
function draw(){const ts=u.sales.filter(x=>today(x.date)),sum=ts.reduce((s,x)=>s+Number(x.total||0),0);$('saleCount').textContent=ts.length+' बिक्री';$('todaySales').innerHTML='<div class="stat">आज कुल बिक्री: <b>₹'+sum.toFixed(2)+'</b></div>'+(ts.length?'<div class="tablewrap"><table class="table"><tr><th>Product</th><th>Qty</th><th>Amount</th><th>Payment</th><th>Action</th></tr>'+ts.slice().reverse().map(x=>'<tr><td>'+esc(x.item)+'</td><td>'+x.qty+'</td><td>₹'+money(x.total)+'</td><td>'+(x.pay==='credit'?'📒 उधार':'💵 Cash')+'</td><td><button class="secondary miniBtn" data-receipt="'+x.id+'">🧾 Bill</button></td></tr>').join('')+'</table></div>':'<div class="empty">आज अभी कोई बिक्री नहीं हुई।</div>')}
$('todaySales').addEventListener('click',e=>{const b=e.target.closest('[data-receipt]');if(b){const x=u.sales.find(s=>s.id===b.dataset.receipt);if(x)invoice(x)}});
$('saleForm').addEventListener('submit',e=>{e.preventDefault();try{const x=selected(),q=Number($('saleQty').value),rate=Number($('salePrice').value),pay=$('salePay').value,customer=$('saleCustomer').value.trim(),received=Number($('saleReceived').value)||0,promise=$('salePromise').value,saleDate=$('saleDate').value;if(!saleDate)return showMsg('बिक्री की तारीख चुनें','err');if(!x)return showMsg('पहले Product चुनें','err');if(!q||q<=0)return showMsg('Quantity सही डालें','err');if(q>x.qty)return showMsg('Stock पर्याप्त नहीं है','err');if(!Number.isFinite(rate)||rate<0)return showMsg('बिक्री कीमत सही डालें','err');const baseTotal=q*rate,gstRate=Number($('saleGst')?.value||0),gstAmount=baseTotal*gstRate/100,total=baseTotal+gstAmount;if(pay==='credit'&&!customer)return showMsg('उधार के लिए Customer Name डालें','err');if(pay==='credit'&&received>total)return showMsg('Received Payment बिक्री रकम से ज्यादा नहीं हो सकती','err');const date=saleDate+'T12:00:00',sale={id:uid(),date,itemId:x.id,item:x.name,qty:q,rate,baseTotal,gstRate,gstAmount,total,pay,customer};x.qty-=q;if(pay==='credit'){const k={id:uid(),saleId:sale.id,customer,itemId:x.id,item:x.name,total,paid:received,due:Math.max(0,total-received),promise,date};sale.khataId=k.id;u.khata.push(k)}u.sales.push(sale);if(!safeSave())return;x.qty=Number(x.qty);e.target.reset();$('saleQty').value=1;$('saleDate').value=localISODate();$('salePrice').value='';$('creditFields').classList.add('hidden');draw();showMsg(pay==='credit'?'उधारी दर्ज हो गई ✓ Stock भी कम हुआ':'बिक्री दर्ज हो गई ✓ Stock भी कम हुआ')}catch(err){showMsg('Sale error: '+err.message,'err')}});draw()
}

function khata(){const u=current();$('content').innerHTML='<div class="card"><h2>📒 Khata / उधारी</h2><input id="khataSearch" placeholder="Customer या item खोजें…" style="margin-bottom:10px"><div id="khataList"></div></div>';function draw(){const q=($('khataSearch').value||'').toLowerCase();const arr=u.khata.filter(x=>(String(x.customer)+' '+String(x.item)).toLowerCase().includes(q));const due=arr.reduce((s,x)=>s+Number(x.due||0),0);$('khataList').innerHTML='<div class="stat">दिख रही उधारी: <b class="red">₹'+due.toFixed(2)+'</b></div>'+(arr.length?arr.map((x,i)=>'<div class="item"><b>'+esc(x.customer)+'</b> <span class="tag">'+esc(x.item)+'</span><p>कुल ₹'+money(x.total)+' • Paid ₹'+money(x.paid)+' • <span class="red">बाकी ₹'+money(x.due)+'</span></p><label>Paid Amount<input data-paid="'+x.id+'" type="number" min="0" max="'+x.total+'" step="0.01" value="'+x.paid+'"></label><label>Promise Date<input data-promise="'+x.id+'" type="date" value="'+esc(x.promise||'')+'"></label><div class="row"><button data-update="'+x.id+'">Update</button><button data-full="'+x.id+'" class="success">पूरा Payment मिला</button></div></div>').join(''):'<div class="empty">अभी कोई उधारी नहीं है।<br>Sale में Credit चुनने पर यहाँ entry आएगी।</div>')}$(document).getElementById('khataSearch').addEventListener('input',draw);$('khataList').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.update||b.dataset.full,x=u.khata.find(k=>k.id===id);if(!x)return;if(b.dataset.full!==undefined){x.paid=x.total;x.due=0}else{const paid=Math.min(Number(x.total||0),Math.max(0,Number(document.querySelector('[data-paid="'+id+'"]').value)||0));x.paid=paid;x.due=Math.max(0,Number(x.total||0)-paid);x.promise=document.querySelector('[data-promise="'+id+'"]').value}safeSave();draw();showMsg('Khata update हो गया ✓')});draw()
}

function reports(){
const u=current();
$('content').innerHTML='<div class="card"><h2>📊 Reports</h2><div class="two"><label>From Date<input id="rFrom" type="date"></label><label>To Date<input id="rTo" type="date"></label></div><div class="two"><label>Product<select id="rProduct"><option value="">All Products</option>'+u.items.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></label><label>Payment<select id="rPay"><option value="">All</option><option value="paid">Cash / Paid</option><option value="credit">Credit</option></select></label></div><div class="row"><button id="rClear" class="secondary">Clear Filter</button><button id="rCsv" class="secondary">⬇️ Export CSV</button></div><div id="rStats"></div></div><div class="card"><h3>Sales History</h3><div id="rTable" class="tablewrap"></div></div>';
function filtered(){const f=$('rFrom').value,t=$('rTo').value,p=$('rProduct').value,pay=$('rPay').value;return u.sales.filter(x=>{const d=String(x.date).slice(0,10);return(!f||d>=f)&&(!t||d<=t)&&(!p||x.itemId===p)&&(!pay||x.pay===pay)})}
function draw(){const a=filtered(),total=a.reduce((s,x)=>s+Number(x.total||0),0),profit=a.reduce((s,x)=>{const it=u.items.find(i=>i.id===x.itemId);return s+Number(x.qty||0)*(Number(x.rate||0)-Number(it?.buy||0))},0),credit=a.filter(x=>x.pay==='credit').reduce((s,x)=>s+Number(x.total||0),0);$('rStats').innerHTML='<div class="grid"><div class="stat">बिक्री<br><b>₹'+money(total)+'</b></div><div class="stat">Profit (अनुमानित)<br><b class="green">₹'+money(profit)+'</b></div><div class="stat">Sales Count<br><b>'+a.length+'</b></div><div class="stat">Credit Sales<br><b>₹'+money(credit)+'</b></div></div>';$('rTable').innerHTML=a.length?'<table class="table"><tr><th>Date</th><th>Product</th><th>Qty</th><th>Amount</th><th>Payment</th><th>Action</th></tr>'+a.slice().reverse().map(x=>'<tr><td>'+new Date(x.date).toLocaleDateString('en-IN')+'</td><td>'+esc(x.item)+'</td><td>'+x.qty+'</td><td>₹'+money(x.total)+'</td><td>'+esc(x.pay==='credit'?'Credit':'Cash')+'</td><td><button class="secondary miniBtn" data-edit="'+x.id+'">✏️</button> <button class="danger miniBtn" data-delete="'+x.id+'">🗑️</button> <button class="secondary miniBtn" data-bill="'+x.id+'">🧾</button></td></tr>').join('')+'</table>':'<div class="empty">इस filter में कोई sales नहीं है।</div>'}
['rFrom','rTo','rProduct','rPay'].forEach(id=>$(id).addEventListener('change',draw));$('rClear').addEventListener('click',()=>{$('rFrom').value='';$('rTo').value='';$('rProduct').value='';$('rPay').value='';draw()});$('rCsv').addEventListener('click',()=>exportCSV(filtered()));$('rTable').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const x=u.sales.find(s=>s.id===(b.dataset.edit||b.dataset.delete||b.dataset.bill));if(!x)return;if(b.dataset.edit)editSale(x,draw);if(b.dataset.delete)deleteSale(x,draw);if(b.dataset.bill)invoice(x)});draw()
}

function editSale(sale,after){
const u=current();const oldItem=u.items.find(i=>i.id===sale.itemId);if(!oldItem)return showMsg('Product नहीं मिला, Sale edit नहीं हो सकती','err');
const oldQty=Number(sale.qty||0);
const oldKhata=sale.khataId?u.khata.find(k=>k.id===sale.khataId):null;
const modal=document.createElement('div');modal.className='modal productModal';modal.id='editSaleModal';modal.innerHTML='<div class="productBox"><div class="productHeader"><h3>✏️ Sale Edit करें</h3><button type="button" id="xEdit" class="secondary">✕</button></div><div class="voiceAll"><button type="button" class="micBtn voiceAllBtn" id="smartEditMic">🎤</button><div class="voiceAllText"><b>एक बार बोलकर Sale Edit करें</b>जैसे: “मात्रा 2, कीमत 450”</div></div><form id="editSaleForm"><label>Date<input id="eDate" type="date" value="'+String(sale.date).slice(0,10)+'" required></label><label>Product<select id="eProduct" required>'+u.items.map(x=>'<option value="'+x.id+'" '+(x.id===sale.itemId?'selected':'')+'>'+esc(x.name)+' — Stock '+x.qty+'</option>').join('')+'</select></label><div class="two"><label>Quantity<input id="eQty" type="number" min="0.01" step="0.01" value="'+sale.qty+'" required></label><label>Rate / Unit (₹)<input id="eRate" type="number" min="0" step="0.01" value="'+sale.rate+'" required></label></div><label>Payment<select id="ePay"><option value="paid" '+(sale.pay==='paid'?'selected':'')+'>Cash / Paid</option><option value="credit" '+(sale.pay==='credit'?'selected':'')+'>Credit / उधार</option></select></label><div id="eCredit" class="'+(sale.pay==='credit'?'':'hidden')+'"><label>Customer Name<input id="eCustomer" value="'+esc(sale.customer||oldKhata?.customer||'')+'"></label><div class="two"><label>Paid<input id="eReceived" type="number" min="0" step="0.01" value="'+(oldKhata?.paid||0)+'"></label><label>Promise Date<input id="ePromise" type="date" value="'+esc(oldKhata?.promise||'')+'"></label></div></div><div class="row formActions"><button type="button" id="cancelEdit" class="cancelBtn">Cancel</button><button type="submit">✓ Save Changes</button></div></form></div>';
document.body.appendChild(modal);if($('smartEditMic'))$('smartEditMic').onclick=()=>startSmartVoice('smartEditMic');const close=()=>modal.remove();$('xEdit').onclick=close;$('cancelEdit').onclick=close;$('ePay').onchange=()=>$('eCredit').classList.toggle('hidden',$('ePay').value!=='credit');
$('editSaleForm').onsubmit=e=>{e.preventDefault();const ni=u.items.find(i=>i.id===$('eProduct').value),q=Number($('eQty').value),rate=Number($('eRate').value),pay=$('ePay').value,customer=$('eCustomer').value.trim(),paid=Number($('eReceived').value)||0,promise=$('ePromise').value;if(!ni||!q||q<=0||!Number.isFinite(rate)||rate<0){showMsg('Sale details सही भरें','err');return}const available=Number(ni.qty||0)+(ni===oldItem?oldQty:0);if(q>available){showMsg('नए Product का Stock पर्याप्त नहीं है','err');return}if(pay==='credit'&&!customer){showMsg('उधार के लिए Customer Name डालें','err');return}const total=q*rate;if(pay==='credit'&&paid>total){showMsg('Paid amount total से ज्यादा नहीं हो सकता','err');return}if(oldKhata)u.khata=u.khata.filter(k=>k.id!==oldKhata.id);oldItem.qty+=oldQty;ni.qty-=q;sale.date=$('eDate').value+'T12:00:00';sale.itemId=ni.id;sale.item=ni.name;sale.qty=q;sale.rate=rate;sale.total=total;sale.pay=pay;sale.customer=customer;delete sale.khataId;if(pay==='credit'){const k={id:uid(),saleId:sale.id,customer,itemId:ni.id,item:ni.name,total,paid,due:Math.max(0,total-paid),promise,date:sale.date};sale.khataId=k.id;u.khata.push(k)}safeSave();close();after();showMsg('Sale update हो गई ✓')};
}

function deleteSale(sale,after){if(!confirm('⚠️ यह Sale delete होगी और उसका quantity Stock में वापस जुड़ जाएगा।\n\nक्या आप जारी रखना चाहते हैं?'))return;const u=current(),it=u.items.find(i=>i.id===sale.itemId);if(it)it.qty+=Number(sale.qty||0);if(sale.khataId)u.khata=u.khata.filter(k=>k.id!==sale.khataId);u.sales=u.sales.filter(s=>s.id!==sale.id);safeSave();after();showMsg('Sale delete हो गई ✓ Stock वापस update हुआ')}

function invoice(sale){
const u=current();const k=sale.khataId?u.khata.find(x=>x.id===sale.khataId):null;const modal=document.createElement('div');modal.className='modal productModal';modal.innerHTML='<div class="productBox"><div class="productHeader"><h3>🧾 Sale Bill</h3><button id="closeInv" class="secondary">✕</button></div><div id="invoicePrint" class="invoice"><h2>'+esc(u.shop)+'</h2><div>'+esc(u.name)+' • '+esc(u.phone)+'</div><hr><p><b>Date:</b> '+new Date(sale.date).toLocaleDateString('en-IN')+'</p><p><b>Product:</b> '+esc(sale.item)+'</p><p><b>Qty:</b> '+sale.qty+' × ₹'+money(sale.rate)+'</p><p>Subtotal: ₹'+money(sale.baseTotal??sale.total)+'</p>'+(Number(sale.gstRate||0)>0?'<p><b>GST '+sale.gstRate+'%:</b> ₹'+money(sale.gstAmount)+'</p>':'')+'<h2>Total: ₹'+money(sale.total)+'</h2><p><b>Payment Method:</b> '+esc(sale.pay==='credit'?'Credit / उधार':'Cash / Paid')+'</p>'+(k?'<p><b>Customer:</b> '+esc(k.customer)+'<br>Paid: ₹'+money(k.paid)+'<br>Due: ₹'+money(k.due)+'</p>':'')+'<p>धन्यवाद! फिर आइए 🙏</p></div><div class="row"><button id="printInv">🖨️ Print / Save PDF</button><button id="shareInv" class="secondary">📤 Share</button><button id="closeInv2" class="cancelBtn">Close</button></div></div>';document.body.appendChild(modal);const close=()=>modal.remove();$('closeInv').onclick=close;$('closeInv2').onclick=close;$('printInv').onclick=()=>{const html=$('invoicePrint').innerHTML;const w=window.open('','_blank','width=500,height=700');if(!w)return showMsg('Popup blocked है। Browser में popup allow करें।','err');w.document.write('<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sale Bill</title><style>body{font-family:Arial;padding:24px}hr{border:0;border-top:1px solid #ccc} .alert{background:#fff4d6;border:1px solid #f1d28a;padding:10px;border-radius:12px;margin:8px 0}.miniBtn{padding:6px 8px;font-size:12px}.invoice{background:#fff;border:1px dashed #aaa;border-radius:12px;padding:18px;text-align:left}.hidden{display:none!important}.micBtn span{line-height:9px}.voiceWrap .micBtn{display:flex;flex-direction:column;justify-content:center;align-items:center}.voiceWrap{min-width:0}.voiceHint{font-weight:600}.micBtn:active{transform:scale(.96)} </style>\n<style>.passwordInline{display:none;position:sticky;top:8px;z-index:20;margin:0 0 12px;padding:12px;border-radius:12px;font-weight:800;text-align:center}.passwordInline.show{display:block}.passwordInline.err{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}.passwordInline:not(.err){background:#dcfce7;color:#166534;border:1px solid #bbf7d0}.voiceAll{position:relative}.voiceAllBtn{box-shadow:0 8px 20px rgba(79,70,229,.18)!important}.productBox .productHeader{padding-right:0}.productBox .formActions{position:sticky!important;left:auto!important;transform:none!important;bottom:auto!important;width:100%!important;box-sizing:border-box!important;margin-top:14px!important;padding:8px 0!important;z-index:5!important;display:grid!important;grid-template-columns:1fr!important}.productBox .formActions>*{min-height:50px!important;width:100%!important}.stockFormActions button{max-width:none!important}.productBox{padding-bottom:20px!important}.floatingMsg{top:64px!important;left:50%!important;right:auto!important;transform:translateX(-50%)!important;width:min(92vw,520px)!important;text-align:center!important;z-index:40000!important}</style>\n</head><body>'+html+'<div style="margin-top:16px;text-align:center"><button onclick="window.close()" style="padding:12px 24px;border:0;border-radius:10px;background:#111827;color:#fff;font-weight:700">← वापस लेखो ऐप</button></div></body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),300)};$('shareInv').onclick=async()=>{const text=u.shop+'\n'+sale.item+' × '+sale.qty+'\nTotal ₹'+money(sale.total);if(navigator.share){try{await navigator.share({title:'Sale Bill',text})}catch(e){}}else{await navigator.clipboard?.writeText(text);showMsg('Bill details copy हो गए ✓')}}}

function exportCSV(arr){const rows=[['Date','Product','Quantity','Rate','Total','Payment','Customer'],...arr.map(x=>[String(x.date).slice(0,10),x.item,x.qty,x.rate,x.total,x.pay,x.customer||''])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');downloadBlob(csv,'lekho-sales-'+localISODate()+'.csv','text/csv');showMsg('CSV download शुरू हो गया ✓')}
function exportBackup(){const u=current();const data={app:'लेखो ऐप',version:APP_VERSION,exportedAt:new Date().toISOString(),user:{userId:u.userId,name:u.name,shop:u.shop,phone:u.phone,prof:u.prof},items:u.items,sales:u.sales,khata:u.khata};downloadBlob(JSON.stringify(data,null,2),'lekho-backup-'+localISODate()+'.json','application/json');showMsg('Backup download हो गया ✓')}
function importBackup(file){const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data||!data.user||!Array.isArray(data.items)||!Array.isArray(data.sales)||!Array.isArray(data.khata))throw Error('Invalid backup');const u=current();if(!confirm('⚠️ Import करने पर इस account का current Stock, Sales और Khata backup से replace होगा।\n\nजारी रखें?'))return;u.name=data.user.name||u.name;u.shop=data.user.shop||u.shop;u.phone=data.user.phone||u.phone;u.prof=data.user.prof||u.prof;u.items=data.items;u.sales=data.sales;u.khata=data.khata;safeSave();openApp();showMsg('Backup restore हो गया ✓')}catch(e){showMsg('Backup file सही नहीं है','err')}};r.readAsText(file)}
function downloadBlob(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function daysUntil(ds){const d=new Date(ds+'T12:00:00'),t=new Date();t.setHours(12,0,0,0);return Math.ceil((d-t)/86400000)}
function money(v){return Number(v||0).toFixed(2)}
function account(){const u=current();$('content').innerHTML='<div class="card"><h2>👤 Account / खाता</h2><p><b>नाम / Name:</b> '+esc(u.name)+'<br><b>दुकान / Shop:</b> '+esc(u.shop)+'<br><b>व्यवसाय / Business:</b> '+esc(u.prof)+'<br><b>यूज़र आईडी / User ID:</b> '+esc(u.userId||u.phone)+'<br><b>मोबाइल / Mobile:</b> '+esc(u.phone)+'</p><button id="openChangePassword" type="button">🔐 Change Password / पासवर्ड बदलें</button></div><div id="passwordCard" class="card hidden"><div class="sectionTitle"><h3>🔐 Change Password / पासवर्ड बदलें</h3><button id="closePassword" type="button" class="secondary" style="width:auto">✕</button></div><div id="passwordInline" class="passwordInline"></div><div class="otpTabs"><button id="passTab" type="button">Password से</button><button id="otpTab" type="button" class="secondary">OTP से</button></div><div id="passMode"><label>User ID / यूज़र आईडी<input id="passUserId" autocomplete="username" value="'+esc(u.userId||'')+'"></label><label>Mobile Number / मोबाइल नंबर<input id="passPhone" inputmode="numeric" maxlength="10" value="'+esc(u.phone||'')+'"></label><label>पुराना Password / Current Password<input id="oldPass" type="password"></label><label>नया Password / New Password<input id="newPass" type="password" minlength="6"></label><button id="changePass" type="button">✓ Save Password / पासवर्ड सेव करें</button></div><div id="otpMode" class="otpBox hidden"><label>मोबाइल नंबर / Mobile Number<input id="otpPhone" inputmode="numeric" maxlength="10" value="'+esc(u.phone)+'"></label><button id="sendOtp" type="button">📱 OTP भेजें / Send OTP</button><label>OTP / ओटीपी<input id="otpCode" inputmode="numeric" maxlength="6" placeholder="6 digit OTP"></label><label>नया Password / New Password<input id="otpNewPass" type="password" minlength="6"></label><label>Confirm Password / पासवर्ड फिर डालें<input id="otpConfirm" type="password" minlength="6"></label><button id="verifyOtp" type="button">✓ OTP Verify & Save Password</button><div id="otpHint" class="muted" style="margin-top:8px"></div></div></div><div class="card"><h3>💾 Backup & Data / बैकअप</h3><p class="muted">Backup file बनाकर सुरक्षित रखें। Restore करने पर current data replace होगा।</p><div class="row"><button id="backupBtn">⬇️ Backup JSON</button><button id="restoreBtn" class="secondary">⬆️ Restore Backup</button><input id="backupFile" type="file" accept="application/json" class="hidden"></div></div>';$('backupBtn').onclick=exportBackup;$('restoreBtn').onclick=()=>$('backupFile').click();$('backupFile').onchange=e=>{if(e.target.files[0])importBackup(e.target.files[0])};$('openChangePassword').onclick=()=>{$('passwordCard').classList.remove('hidden');$('openChangePassword').classList.add('hidden');$('passwordCard').scrollIntoView({behavior:'smooth',block:'start'})};$('closePassword').onclick=()=>{$('passwordCard').classList.add('hidden');$('openChangePassword').classList.remove('hidden');window.scrollTo(0,0)};$('passTab').onclick=()=>{$('passMode').classList.remove('hidden');$('otpMode').classList.add('hidden');$('passTab').classList.remove('secondary');$('otpTab').classList.add('secondary')};$('otpTab').onclick=()=>{$('passMode').classList.add('hidden');$('otpMode').classList.remove('hidden');$('otpTab').classList.remove('secondary');$('passTab').classList.add('secondary')};const localErr=m=>{const e=$('passwordInline');e.textContent=m;e.className='passwordInline show err';clearTimeout(account.errT);account.errT=setTimeout(()=>e.className='passwordInline',6000)};$('changePass').onclick=()=>{const uid=$('passUserId').value.trim().toLowerCase(),phone=cleanPhone($('passPhone').value),old=$('oldPass').value,newp=$('newPass').value;if(!uid)return localErr('User ID / यूज़र आईडी खाली है।');if(uid!==(u.userId||'').toLowerCase())return localErr('User ID / यूज़र आईडी गलत है।');if(phone.length!==10)return localErr('Mobile Number / मोबाइल नंबर गलत है। 10 अंक डालें।');if(phone!==cleanPhone(u.phone))return localErr('Mobile Number / मोबाइल नंबर account से match नहीं करता।');if(!old)return localErr('Current Password / पुराना Password खाली है।');if(old!==u.password)return localErr('Current Password / पुराना Password गलत है।');if(!newp)return localErr('New Password / नया Password खाली है।');if(newp.length<6)return localErr('New Password / नया Password कम से कम 6 अक्षर का रखें।');if(newp===old)return localErr('नया Password पुराने Password से अलग रखें।');const before=u.password;u.password=newp;if(!safeSave()){u.password=before;return localErr('Password save नहीं हुआ। कृपया फिर से कोशिश करें।')}localErr('Password update हो गया ✓');$('oldPass').value='';$('newPass').value=''};let otpVerificationId=null;$('sendOtp').onclick=()=>{const phone=cleanPhone($('otpPhone').value);if(phone.length!==10)return localErr('Mobile Number / मोबाइल नंबर गलत है। 10 अंक डालें।');if(cleanPhone(u.phone)!==phone)return localErr('Mobile Number / मोबाइल नंबर account से match नहीं करता।');if(!window.AndroidSpeech||typeof window.AndroidSpeech.sendOtp!=='function')return localErr('OTP सुविधा इस APK में उपलब्ध नहीं है।');$('otpHint').textContent='OTP भेजा जा रहा है…';window.__otpSent=id=>{otpVerificationId=id;$('otpHint').textContent='OTP SMS में भेज दिया गया है।';localErr('OTP भेज दिया गया ✓')};window.__otpError=msg=>{$('otpHint').textContent='';localErr(msg||'OTP भेजा नहीं जा सका।')} ;window.AndroidSpeech.sendOtp('+91'+phone)};$('verifyOtp').onclick=()=>{const code=$('otpCode').value.trim(),newp=$('otpNewPass').value,conf=$('otpConfirm').value;if(!otpVerificationId)return localErr('पहले OTP भेजें।');if(!/^\d{6}$/.test(code))return localErr('सही 6 digit OTP डालें।');if(!newp)return localErr('New Password / नया Password खाली है।');if(newp.length<6)return localErr('New Password / नया Password कम से कम 6 अक्षर का रखें।');if(newp!==conf)return localErr('दोनों Password समान होने चाहिए।');window.__otpVerified=()=>{const before=u.password;u.password=newp;if(!safeSave()){u.password=before;return localErr('Password save नहीं हुआ। कृपया फिर से कोशिश करें।')}localErr('OTP verified और Password save हो गया ✓');$('otpCode').value='';$('otpNewPass').value='';$('otpConfirm').value=''};window.__otpError=msg=>localErr(msg||'OTP गलत है या expire हो गया।');window.AndroidSpeech.verifyOtp(otpVerificationId,code)}}

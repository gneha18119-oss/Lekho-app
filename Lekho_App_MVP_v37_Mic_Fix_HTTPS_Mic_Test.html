<script>'use strict';
(function(){
const KEY='lekhoMVP25';const APP_VERSION='1.0-MVP';let db={users:{},current:null};let page='home';const $=id=>document.getElementById(id);
function showMsg(text,type='ok'){const e=$('systemMsg');e.textContent=text;e.className='msg show '+type;clearTimeout(showMsg.t);showMsg.t=setTimeout(()=>{e.className='msg'},5000)}
window.addEventListener('error',e=>showMsg('App error: '+e.message,'err'));window.addEventListener('unhandledrejection',e=>showMsg('App error: '+String(e.reason),'err'));
function safeLoad(){try{const r=window.localStorage?window.localStorage.getItem(KEY):null;if(r){const x=JSON.parse(r);if(x&&x.users&&typeof x.users==='object'){db=x;if(!db.current)db.current=null}}}catch(e){db={users:{},current:null}}}
function safeSave(){try{if(window.localStorage){window.localStorage.setItem(KEY,JSON.stringify(db));return true}}catch(e){}try{if(window.sessionStorage){window.sessionStorage.setItem(KEY,JSON.stringify(db));return true}}catch(e){}return false}
function current(){return db.current&&db.users[db.current]?db.users[db.current]:null}function cleanPhone(v){return String(v||'').replace(/\D/g,'').slice(0,10)}
function uid(){try{if(window.crypto&&typeof window.crypto.randomUUID==='function')return window.crypto.randomUUID()}catch(e){}return 'id_'+Date.now()+'_'+Math.random().toString(36).slice(2)}
function localISODate(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}
function authMode(mode){$('loginCard').style.display=mode==='login'?'block':'none';$('signupCard').classList.toggle('hidden',mode!=='signup');$('forgotCard').style.display=mode==='forgot'?'block':'none';$('systemMsg').className='msg'}
function openApp(){const u=current();if(!u)return authMode('login');$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('shopName').textContent=u.shop;$('welcome').textContent='नमस्ते '+u.name+' • '+u.prof;render()}
function logout(){db.current=null;safeSave();$('app').classList.add('hidden');$('auth').classList.remove('hidden');authMode('login');showMsg('Logout हो गया ✓')}
$('showSignup').addEventListener('click',()=>authMode('signup'));
$('showForgot').addEventListener('click',()=>authMode('forgot'));
$('backLogin').addEventListener('click',()=>authMode('login'));

'details']})){v=grab(keys,['मात्रा','quantity','qty','खरीद','purchase','cost','बिक्री','sale','price','कीमत','रंग','color','size','साइज','डिजाइन','design','मॉडल','model','शेड','shade','आईएमईआई','imei','ram','रैम','storage','स्टोरेज','warranty','वारंटी','expiry','एक्सपायरी','न्यूनतम','minimum','min']);if(v)set(k,v)}let q=t.match(new RegExp('(?:मात्रा|quantity|qty|क्वांटिटी)\\s*('+numRe+')','i'));if(q){const n=number(q[1]);if(n!==null)set('qty',n)}let min=t.match(new RegExp('(?:minimum|min|न्यूनतम|कम से कम|लो स्टॉक)\\s*('+numRe+')','i'));if(min){const n=number(min[1]);if(n!==null)set('min',n)}let buy=t.match(new RegExp('(?:खरीद|purchase|cost|buy)\\s*₹?\\s*('+numRe+')','i'));if(buy){const n=number(buy[1]);if(n!==null)set('buy',n)}let sell=t.match(new RegExp('(?:बिक्री|sale|selling|sell|कीमत|price)\\s*₹?\\s*('+numRe+')','i'));if(sell){const n=number(sell[1]);if(n!==null)set('sell',n)}const units=[['kg','किलो'],['gram','ग्राम'],['litre','लीटर'],['packet','पैकेट'],['box','बॉक्स'],['bottle','बोतल'],['piece','पीस'],['meter','मीटर'],['pair','जोड़ी']];for(const [value,...words] of units){if(words.some(w=>new RegExp('(?:'+w+'|'+value+')','i').test(t))){const u=root?.querySelector('[data-f="unit"]');if(u&&[...u.options].some(o=>o.value===value)){u.value=value;u.dispatchEvent(new Event('change',{bubbles:true}))}break}}return true}
function fillSmartSale(text,mode){const t=normalizeVoiceText(text);const find=sel=>document.querySelector(sel);let changed=[];let prodName=null;let m=t.match(/(?:product|प्रोडक्ट|नाम)\s+(.+?)(?=\s+(?:मात्रा|quantity|qty|क्वांटिटी|कीमत|price|rate|बिक्री|cash|नकद|paid|उधार|credit|ग्राहक|customer)\b|$)/i);if(m)prodName=m[1].trim();else{m=t.match(/^(.+?)(?=\s+(?:मात्रा|quantity|qty|क्वांटिटी|कीमत|price|rate|बिक्री|cash|नकद|paid|उधार|credit)\b)/i);if(m)prodName=m[1].trim()}const prod=find(mode==='edit'?'#eProduct':'#saleProduct');if(prod&&prodName){const opts=[...prod.options];const hit=opts.find(o=>o.textContent.toLowerCase().includes(prodName.toLowerCase()));if(hit){prod.value=hit.value;prod.dispatchEvent(new Event('change',{bubbles:true}));changed.push('Product')}}let q=t.match(/(?:मात्रा|quantity|qty|क्वांटिटी)\s*(\d+(?:\.\d+)?)/i);let price=t.match(/(?:कीमत|price|rate|बिक्री|sale)\s*₹?\s*(\d+(?:\.\d+)?)/i);let bare=t.match(/^\S+\s+(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)/);if(!q&&bare)q=[null,bare[1]];if(!price&&bare)price=[null,bare[2]];if(mode==='edit'){if(q&&find('#eQty')){find('#eQty').value=q[1];changed.push('Quantity')}if(price&&find('#eRate')){find('#eRate').value=price[1];changed.push('Rate')} }else{if(q&&find('#saleQty')){find('#saleQty').value=q[1];find('#saleQty').dispatchEvent(new Event('input',{bubbles:true}));changed.push('Quantity')}if(price&&find('#salePrice')){find('#salePrice').value=price[1];find('#salePrice').dispatchEvent(new Event('input',{bubbles:true}));changed.push('Price')}}const credit=/(?:उधार|credit)/i.test(t);const paid=/(?:cash|नकद|paid|कैश)/i.test(t);const pay=find(mode==='edit'?'#ePay':'#salePay');if(pay&&(credit||paid)){pay.value=credit?'credit':'paid';pay.dispatchEvent(new Event('change',{bubbles:true}));changed.push('Payment')}let cm=t.match(/(?:ग्राहक|customer|उधार)\s+(.+?)(?=\s+(?:मिला|paid|प्राप्त|वादा|promise|तारीख|date)\b|$)/i);if(cm){const c=find(mode==='edit'?'#eCustomer':'#saleCustomer');if(c){c.value=cm[1].trim();changed.push('Customer')}}return changed}
async async function startSmartVoice(target){if(!voiceSupported()){showMsg('Voice Recognition इस Browser में उपलब्ध नहीं है। इसे Chrome में HTTPS/hosted app के रूप में खोलें।','err');return}if(!await prepareMic())return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const r=new SR();r.lang='hi-IN';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;const btn=document.getElementById(target);if(btn)btn.classList.add('listening');showMicStatus('🎤 <b>सुन रहा हूँ…</b> पूरा वाक्य बोलिए');r.onstart=()=>showMicStatus('🎤 <b>Mic चालू है…</b> अब बोलिए');r.onresult=e=>{let text='';for(let i=e.resultIndex||0;i<e.results.length;i++){if(e.results[i].isFinal)text+=e.results[i][0].transcript+' '}text=text.trim();if(!text)return;if(!text){showMsg('आवाज़ समझ नहीं आई, फिर से Mic दबाएँ।','err');return}if(target==='smartStockMic'){const root=btn.closest('.productBox');fillSmartStock(root,text)}else if(target==='smartSaleMic'){fillSmartSale(text,'sale')}else if(target==='smartEditMic'){fillSmartSale(text,'edit')}showMicStatus('✓ डेटा समझ लिया: '+esc(text))};r.onerror=e=>{const msg=e.error==='not-allowed'?'Microphone permission Allow करें।':e.error==='service-not-allowed'?'Speech service उपलब्ध नहीं है। Internet चालू रखें और Chrome में कोशिश करें।':e.error==='audio-capture'?'Microphone उपलब्ध नहीं है या किसी दूसरे app ने उसे इस्तेमाल किया है।':'no-speech'===e.error?'आवाज़ नहीं मिली। Mic दबाकर फिर से साफ बोलें।':'network'===e.error?'Voice service के लिए Internet चालू रखें।':'aborted'===e.error?'Mic बंद हो गया। फिर 🎤 दबाएँ।':'Voice input शुरू नहीं हो पाया।';showMsg(msg,'err')};r.onend=()=>{if(btn)btn.classList.remove('listening');setTimeout(()=>{const el=$('micStatus');if(el)el.classList.remove('show')},900)};try{r.start()}catch(e){if(btn)btn.classList.remove('listening');showMsg('Microphone अभी busy है। 2 सेकंड बाद फिर कोशिश करें।','err')}}

function shopInsights(u){
 const due=u.khata.reduce((s,x)=>s+Number(x.due||0),0);const old=u.khata.filter(x=>Number(x.due)>0&&x.promise&&daysUntil(x.promise)<0);const dup=[];const seen={};u.sales.forEach(x=>{const k=[String(x.date).slice(0,10),x.itemId,x.qty,x.rate,x.customer||'',x.pay].join('|');if(seen[k])dup.push(x);else seen[k]=x});const tasks=[];if(old.length)tasks.push('🔴 '+old.length+' पुराने pending उधार पर follow-up करें');if(due>0)tasks.push('💰 कुल ₹'+money(due)+' अभी ग्राहकों से लेना बाकी है');const low=u.items.filter(x=>Number(x.qty)<=Number(x.min||0));if(low.length)tasks.push('📦 '+low.length+' product का stock कम है');return {due,old,dup,tasks};

const modal=document.createElement('div');modal.className='modal productModal';modal.id='editSaleModal';modal.innerHTML='<div class="productBox"><div class="productHeader"><h3>✏️ Sale Edit करें</h3><button type="button" id="xEdit" class="secondary">✕</button></div><div class="voiceAll"><button type="button" class="micBtn voiceAllBtn" id="smartEditMic">🎤</button><div class="voiceAllText"><b>एक बार बोलकर Sale Edit करें</b>जैसे: “मात्रा 2, कीमत 450”</div></div><form id="editSaleForm"><label>Date<input id="eDate" type="date" value="'+String(sale.date).slice(0,10)+'" required></label><label>Product<select id="eProduct" required>'+u.items.map(x=>'<option value="'+x.id+'" '+(x.id===sale.itemId?'selected':'')+'>'+esc(x.name)+' — Stock '+x.qty+'</option>').join('')+'</select></label><div class="two"><label>Quantity<input id="eQty" type="number" min="0.01" step="0.01" value="'+sale.qty+'" required></label><label>Rate / Unit (₹)<input id="eRate" type="number" min="0" step="0.01" value="'+sale.rate+'" required></label></div><label>Payment<select id="ePay"><option value="paid" '+(sale.pay==='paid'?'selected':'')+'>Cash / Paid</option><option value="credit" '+(sale.pay==='credit'?'selected':'')+'>Credit / उधार</option></select></label><div id="eCredit" class="'+(sale.pay==='credit'?'':'hidden')+'"><label>Customer Name<input id="eCustomer" value="'+esc(sale.customer||oldKhata?.customer||'')+'"></label><div class="two"><label>Paid<input id="eReceived" type="number" min="0" step="0.01" value="'+(oldKhata?.paid||0)+'"></label><label>Promise Date<input id="ePromise" type="date" value="'+esc(oldKhata?.promise||'')+'"></label></div></div><div class="row formActions"><button type="button" id="cancelEdit" class="cancelBtn">Cancel</button><button type="submit">✓ Save Changes</button></div></form></div>';
document.body.appendChild(modal);if($('smartEditMic'))$('smartEditMic').onclick=()=>startSmartVoice('smartEditMic');const close=()=>modal.remove();$('xEdit').onclick=close;$('cancelEdit').onclick=close;$('ePay').onchange=()=>$('eCredit').classList.toggle('hidden',$('ePay').value!=='credit');
$('editSaleForm').onsubmit=e=>{e.preventDefault();const ni=u.items.find(i=>i.id===$('eProduct').value),q=Number($('eQty').value),rate=Number($('eRate').value),pay=$('ePay').value,customer=$('eCustomer').value.trim(),paid=Number($('eReceived').value)||0,promise=$('ePromise').value;if(!ni||!q||q<=0||!Number.isFinite(rate)||rate<0){showMsg('Sale details सही भरें','err');return}const available=Number(ni.qty||0)+(ni===oldItem?oldQty:0);if(q>available){showMsg('नए Product का Stock पर्याप्त नहीं है','err');return}if(pay==='credit'&&!customer){showMsg('उधार के लिए Customer Name डालें','err');return}const total=q*rate;if(pay==='credit'&&paid>total){showMsg('Paid amount total से ज्यादा नहीं हो सकता','err');return}if(oldKhata)u.khata=u.khata.filter(k=>k.id!==oldKhata.id);oldItem.qty+=oldQty;ni.qty-=q;sale.date=$('eDate').value+'T12:00:00';sale.itemId=ni.id;sale.item=ni.name;sale.qty=q;sale.rate=rate;sale.total=total;sale.pay=pay;sale.customer=customer;delete sale.khataId;if(pay==='credit'){const k={id:uid(),saleId:sale.id,customer,itemId:ni.id,item:ni.name,total,paid,due:Math.max(0,total-paid),promise,date:sale.date};sale.khataId=k.id;u.khata.push(k)}safeSave();close();after();showMsg('Sale update हो गई ✓')};
}

function deleteSale(sale,after){if(!confirm('⚠️ यह Sale delete होगी और उसका quantity Stock में वापस जुड़ जाएगा।\n\nक्या आप जारी रखना चाहते हैं?'))return;const u=current(),it=u.items.find(i=>i.id===sale.itemId);if(it)it.qty+=Number(sale.qty||0);if(sale.khataId)u.khata=u.khata.filter(k=>k.id!==sale.khataId);u.sales=u.sales.filter(s=>s.id!==sale.id);safeSave();after();showMsg('Sale delete हो गई ✓ Stock वापस update हुआ')}

function invoice(sale){
const u=current();const k=sale.khataId?u.khata.find(x=>x.id===sale.khataId):null;const modal=document.createElement('div');modal.className='modal productModal';modal.innerHTML='<div class="productBox"><div class="productHeader"><h3>🧾 Sale Bill</h3><button id="closeInv" class="secondary">✕</button></div><div id="invoicePrint" class="invoice"><h2>'+esc(u.shop)+'</h2><div>'+esc(u.name)+' • '+esc(u.phone)+'</div><hr><p><b>Date:</b> '+new Date(sale.date).toLocaleDateString('en-IN')+'</p><p><b>Product:</b> '+esc(sale.item)+'</p><p><b>Qty:</b> '+sale.qty+' × ₹'+money(sale.rate)+'</p><h2>Total: ₹'+money(sale.total)+'</h2><p><b>Payment:</b> '+esc(sale.pay==='credit'?'Credit / उधार':'Cash / Paid')+'</p>'+(k?'<p><b>Customer:</b> '+esc(k.customer)+'<br>Paid: ₹'+money(k.paid)+'<br>Due: ₹'+money(k.due)+'</p>':'')+'<p>धन्यवाद! फिर आइए 🙏</p></div><div class="row"><button id="printInv">🖨️ Print / Save PDF</button><button id="shareInv" class="secondary">📤 Share</button><button id="closeInv2" class="cancelBtn">Close</button></div></div>';document.body.appendChild(modal);const close=()=>modal.remove();$('closeInv').onclick=close;$('closeInv2').onclick=close;$('printInv').onclick=()=>{const html=$('invoicePrint').innerHTML;const w=window.open('','_blank','width=500,height=700');if(!w)return showMsg('Popup blocked है। Browser में popup allow करें।','err');w.document.write('<html><head><title>Sale Bill</title><style>body{font-family:Arial;padding:24px}hr{border:0;border-top:1px solid #ccc} .alert{background:#fff4d6;border:1px solid #f1d28a;padding:10px;border-radius:12px;margin:8px 0}.miniBtn{padding:6px 8px;font-size:12px}.invoice{background:#fff;border:1px dashed #aaa;border-radius:12px;padding:18px;text-align:left}.hidden{display:none!important}.micBtn span{line-height:9px}.voiceWrap .micBtn{display:flex;flex-direction:column;justify-content:center;align-items:center}.voiceWrap{min-width:0}.voiceHint{font-weight:600}.micBtn:active{transform:scale(.96)} </style></head><body>'+html+'</body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),300)};$('shareInv').onclick=async()=>{const text=u.shop+'\n'+sale.item+' × '+sale.qty+'\nTotal ₹'+money(sale.total);if(navigator.share){try{await navigator.share({title:'Sale Bill',text})}catch(e){}}else{await navigator.clipboard?.writeText(text);showMsg('Bill details copy हो गए ✓')}}}

function exportCSV(arr){const rows=[['Date','Product','Quantity','Rate','Total','Payment','Customer'],...arr.map(x=>[String(x.date).slice(0,10),x.item,x.qty,x.rate,x.total,x.pay,x.customer||''])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');downloadBlob(csv,'lekho-sales-'+localISODate()+'.csv','text/csv');showMsg('CSV download शुरू हो गया ✓')}
function exportBackup(){const u=current();const data={app:'लेखो ऐप',version:APP_VERSION,exportedAt:new Date().toISOString(),user:{userId:u.userId,name:u.name,shop:u.shop,phone:u.phone,prof:u.prof},items:u.items,sales:u.sales,khata:u.khata};downloadBlob(JSON.stringify(data,null,2),'lekho-backup-'+localISODate()+'.json','application/json');showMsg('Backup download हो गया ✓')}
function importBackup(file){const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data||!data.user||!Array.isArray(data.items)||!Array.isArray(data.sales)||!Array.isArray(data.khata))throw Error('Invalid backup');const u=current();if(!confirm('⚠️ Import करने पर इस account का current Stock, Sales और Khata backup से replace होगा।\n\nजारी रखें?'))return;u.name=data.user.name||u.name;u.shop=data.user.shop||u.shop;u.phone=data.user.phone||u.phone;u.prof=data.user.prof||u.prof;u.items=data.items;u.sales=data.sales;u.khata=data.khata;safeSave();openApp();showMsg('Backup restore हो गया ✓')}catch(e){showMsg('Backup file सही नहीं है','err')}};r.readAsText(file)}
function downloadBlob(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function daysUntil(ds){const d=new Date(ds+'T12:00:00'),t=new Date();t.setHours(12,0,0,0);return Math.ceil((d-t)/86400000)}
function money(v){return Number(v||0).toFixed(2)}
function account(){const u=current();$('content').innerHTML='<div class="card"><h2>👤 Account</h2><p><b>नाम:</b> '+esc(u.name)+'<br><b>दुकान:</b> '+esc(u.shop)+'<br><b>व्यवसाय:</b> '+esc(u.prof)+'<br><b>User ID:</b> '+esc(u.userId||u.phone)+'<br><b>मोबाइल:</b> '+esc(u.phone)+'</p><hr><h3>🔐 Password बदलें</h3><div class="two"><label>Current Password<input id="oldPass" type="password"></label><label>New Password<input id="newPass" type="password" minlength="6"></label></div><button id="changePass">Password Update</button></div><div class="card"><h3>💾 Backup & Data</h3><p class="muted">Backup केवल इस device/browser के लिए नहीं—file बनाकर कहीं सुरक्षित रखें। Restore करते समय current data replace होगा।</p><div class="row"><button id="backupBtn">⬇️ Backup JSON</button><button id="restoreBtn" class="secondary">⬆️ Restore Backup</button><input id="backupFile" type="file" accept="application/json" class="hidden"></div></div>';$('backupBtn').onclick=exportBackup;$('restoreBtn').onclick=()=>$('backupFile').click();$('backupFile').onchange=e=>{if(e.target.files[0])importBackup(e.target.files[0])};$('changePass').onclick=()=>{if($('oldPass').value!==u.password)return showMsg('Current Password गलत है','err');if($('newPass').value.length<6)return showMsg('New Password कम से कम 6 अक्षर का रखें','err');u.password=$('newPass').value;safeSave();showMsg('Password update हो गया ✓')}}

$('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b){page=b.dataset.page;render();window.scrollTo(0,0)}});function init(){try{safeLoad();authMode('login');if(current())openApp()}catch(e){db={users:{},current:null};authMode(false);showMsg('App शुरू नहीं हो पाया। फिर से खोलें।','err')}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script></body></html>
